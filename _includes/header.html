<header class="site-header">
  <a class="site-title" href="/">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Main">
    <a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Writing</a>
    <a href="/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
    {% for app in site.apps %}{% if app.live %}
    <a class="nav-app" href="{{ app.url }}">{{ app.nav_label | default: app.name }}<span aria-hidden="true">&#8599;</span></a>
    {% endif %}{% endfor %}
  </nav>
</header>
